name: Sincronizar Federación

on:
  push:
    branches: [main]
    paths:
      - data/faf-config.json
      - scripts/sync-faf.mjs
      - .github/workflows/sync-faf.yml
  schedule:
    - cron: "15 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-faf
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar web
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Leer datos de la FAF
        run: node scripts/sync-faf.mjs
      - name: Validar web
        run: npm test
      - name: Publicar si hay cambios
        id: publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/site.json
          git diff --cached --quiet && exit 0
          git commit -m "Actualizar resultados y clasificación desde FAF"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Actualizar GitHub Pages
        if: steps.publish.outputs.changed == 'true' || github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
