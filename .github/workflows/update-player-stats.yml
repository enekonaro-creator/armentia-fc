name: Actualizar estadísticas

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Sumar al total o corregir el total"
        required: true
        type: choice
        options:
          - add
          - set
      player_number:
        description: "Dorsal del jugador"
        required: true
        type: string
      goals:
        description: "Goles"
        required: true
        default: "0"
        type: string
      assists:
        description: "Asistencias"
        required: true
        default: "0"
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar web
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Actualizar estadísticas
        run: node scripts/update-player-stats.mjs
        env:
          MODE: ${{ inputs.mode }}
          PLAYER_NUMBER: ${{ inputs.player_number }}
          GOALS: ${{ inputs.goals }}
          ASSISTS: ${{ inputs.assists }}
      - name: Validar web
        run: npm test
      - name: Publicar actualización
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/site.json
          git diff --cached --quiet && exit 0
          git commit -m "Actualizar estadísticas de jugadores"
          git push
